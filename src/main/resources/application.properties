spring.application.name=oldbook
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=oldbook_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

server.port=${SERVER_PORT}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=bXlfb2xkYm9va19tYXJrZXRwbGFjZV9qd3Rfc2VjcmV0X2tleV8yMDI2
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true