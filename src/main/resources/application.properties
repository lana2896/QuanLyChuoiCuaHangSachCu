spring.application.name=oldbook
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=oldbook_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

server.port=${SERVER_PORT}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=bXlfb2xkYm9va19tYXJrZXRwbGFjZV9qd3Rfc2VjcmV0X2tleV8yMDI2
jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

shipping.sync.provider=portal

shipping.max-delivery-attempts=3

shipping.sync.polling-enabled=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=61MB

# Thanh toán chuyển khoản VietQR + Casso. Khai trong .env; để trống PAYMENT_BANK_* thì checkout chỉ có COD.
payment.bank.bin=${PAYMENT_BANK_BIN:}
payment.bank.account-no=${PAYMENT_BANK_ACCOUNT_NO:}
payment.bank.account-name=${PAYMENT_BANK_ACCOUNT_NAME:}
payment.casso.checksum-key=${PAYMENT_CASSO_CHECKSUM_KEY:}
payment.session-minutes=${PAYMENT_SESSION_MINUTES:5}
payment.expiry-check-ms=30000
