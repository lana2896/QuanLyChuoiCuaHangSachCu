<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đối tác vận chuyển - OldBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body data-page-requires-login>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
    <h1 class="h3 mb-2">Đối tác vận chuyển</h1>
    <p class="text-muted">Mỗi đối tác có một link riêng <code>/shipping/{maCode}</code> để tiếp nhận và cập nhật vận đơn.</p>

    <div id="carrierAlert" class="alert alert-danger d-none" role="alert"></div>

    <div id="carrierContent">
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h6 fw-bold mb-3">Thêm đối tác</h2>
                <div class="row g-2">
                    <div class="col-md-2"><input id="newCode" class="form-control" placeholder="Mã (VD: GHN)" maxlength="30"></div>
                    <div class="col-md-3"><input id="newName" class="form-control" placeholder="Tên đơn vị"></div>
                    <div class="col-md-2"><input id="newFee" type="number" min="0" class="form-control" placeholder="Phí (đ)"></div>
                    <div class="col-md-1"><input id="newDays" type="number" min="0" class="form-control" placeholder="Ngày"></div>
                    <div class="col-md-2"><input id="newPhone" class="form-control" placeholder="Số điện thoại"></div>
                    <div class="col-md-2"><input id="newEmail" type="email" class="form-control" placeholder="Email"></div>
                </div>
                <button type="button" class="btn btn-primary mt-3" onclick="Carriers.create()">
                    <i class="bi bi-plus-lg"></i> Thêm đối tác
                </button>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Tên đơn vị</th>
                        <th>Phí</th>
                        <th>Ngày giao</th>
                        <th>Trạng thái</th>
                        <th>Link đối tác</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="carrierBody">
                    <tr><td colspan="7" class="text-center text-muted py-4">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title h5">Sửa đối tác <span id="editCodeLabel" class="text-muted"></span></h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body">
                <input id="editCode" type="hidden">
                <div class="mb-2"><label for="editName" class="form-label">Tên đơn vị</label><input id="editName" class="form-control"></div>
                <div class="row g-2 mb-2">
                    <div class="col"><label for="editFee" class="form-label">Phí (đ)</label><input id="editFee" type="number" min="0" class="form-control"></div>
                    <div class="col"><label for="editDays" class="form-label">Ngày giao dự kiến</label><input id="editDays" type="number" min="0" class="form-control"></div>
                </div>
                <div class="mb-2"><label for="editPhone" class="form-label">Số điện thoại</label><input id="editPhone" class="form-control"></div>
                <div class="mb-2"><label for="editEmail" class="form-label">Email</label><input id="editEmail" type="email" class="form-control"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-primary" onclick="Carriers.save()">Lưu</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/management/carriers.js}"></script>
</body>
</html>
