<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${branch.tenCuaHang} - Chuỗi nhà sách cũ OldBook|">Chi nhánh - OldBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-4">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/branches}">Hệ thống chi nhánh</a></li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${branch.tenCuaHang}">Chi nhánh</li>
    </ol></nav>

    <section class="branch-hero" aria-labelledby="branchTitle">
        <div class="branch-no branch-no-lg" aria-hidden="true">
            <small>Chi nhánh</small>
            <span th:text="${branch.soChiNhanh != null ? #numbers.formatInteger(branch.soChiNhanh, 2) : '—'}">01</span>
        </div>
        <div class="branch-body">
            <h1 id="branchTitle" th:text="${branch.tenCuaHang}">Tên chi nhánh</h1>
            <p class="branch-line"><i class="bi bi-geo-alt" aria-hidden="true"></i>
                <span th:text="${branch.diaChiCH != null ? branch.diaChiCH : 'Chưa cập nhật địa chỉ'}">Địa chỉ</span>
                <a th:if="${branch.diaChiCH != null}" class="ms-1"
                   th:href="|https://www.google.com/maps/search/?api=1&query=${#uris.escapeQueryParam(branch.diaChiCH)}|"
                   target="_blank" rel="noopener noreferrer">Chỉ đường</a></p>
            <p class="branch-line">
                <span><i class="bi bi-clock" aria-hidden="true"></i>
                    <span th:text="${branch.gioHoatDong != null ? branch.gioHoatDong : 'Liên hệ để biết giờ mở cửa'}">Giờ</span></span>
                <span th:if="${branch.soDienThoaiCH != null}"><i class="bi bi-telephone" aria-hidden="true"></i>
                    <a th:href="|tel:${branch.soDienThoaiCH}|" th:text="${branch.soDienThoaiCH}">SĐT</a></span>
            </p>
            <p class="branch-desc" th:if="${branch.moTa != null}" th:text="${branch.moTa}">Mô tả</p>
        </div>
        <div class="branch-stock">
            <strong th:text="${#numbers.formatInteger(branch.tongTonKho, 1, 'POINT')}">0</strong>
            <span th:text="|cuốn · ${branch.soDauSach} đầu sách|">cuốn</span>
        </div>
    </section>

    <section aria-labelledby="branchBooksTitle">
        <div class="section-title flex-wrap gap-2">
            <h2 id="branchBooksTitle">Sách đang có tại chi nhánh</h2>
            <form th:action="@{/branches/{id}(id=${branch.maCH})}" method="get" class="d-flex align-items-center gap-2">
                <label for="branchSort" class="small text-muted text-nowrap">Sắp xếp</label>
                <select id="branchSort" name="sort" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option value="moi-nhat" th:selected="${sort == 'moi-nhat'}">Mới nhập kho</option>
                    <option value="gia-tang" th:selected="${sort == 'gia-tang'}">Giá thấp đến cao</option>
                    <option value="gia-giam" th:selected="${sort == 'gia-giam'}">Giá cao đến thấp</option>
                    <option value="ten-az" th:selected="${sort == 'ten-az'}">Tên A-Z</option>
                </select>
                <noscript><button type="submit" class="btn btn-sm btn-outline-brown">Xem</button></noscript>
            </form>
        </div>

        <p th:if="${#lists.isEmpty(books.content)}" class="panel text-muted text-center py-4 mb-0">Chi nhánh chưa có sách đang bán.</p>
        <div class="row g-3" th:unless="${#lists.isEmpty(books.content)}">
            <article class="col-6 col-md-4 col-lg-3" th:each="b : ${books.content}"
                     th:with="hasCover=${b.hinhAnhUrl != null and (#strings.startsWith(#strings.toLowerCase(b.hinhAnhUrl), 'http://') or #strings.startsWith(#strings.toLowerCase(b.hinhAnhUrl), 'https://') or (#strings.startsWith(b.hinhAnhUrl, '/') and !#strings.startsWith(b.hinhAnhUrl, '//')))}">
                <div class="book-card">
                    <a th:href="@{/books/{id}(id=${b.maSach})}" class="cover" th:classappend="|c${b.maSach % 6}|">
                        <img th:if="${hasCover}" th:src="${b.hinhAnhUrl}" th:alt="${b.tenSach}" class="related-cover-image" loading="lazy">
                        <span th:unless="${hasCover}" class="cover-title" th:text="${b.tenSach}">Tên sách</span>
                    </a>
                    <div class="book-info">
                        <span th:if="${b.doMoiPercent != null}" class="condition-badge align-self-start mb-2"
                              th:text="|✓ ${#numbers.formatDecimal(b.doMoiPercent, 1, 'POINT', 0, 'COMMA')}% mới|">Tình trạng sách</span>
                        <h3 class="book-title"><a th:href="@{/books/{id}(id=${b.maSach})}" th:text="${b.tenSach}">Tên sách</a></h3>
                        <p class="book-author" th:text="|Tác giả: ${b.tacGia != null ? b.tacGia : 'Chưa cập nhật'}|">Tác giả</p>
                        <p class="price-line mb-2">Giá bán:
                            <strong class="price" th:if="${b.giaBanCu != null}" th:text="|${#numbers.formatDecimal(b.giaBanCu, 1, 'POINT', 0, 'COMMA')} đ|">0 đ</strong>
                            <span th:unless="${b.giaBanCu != null}">Chưa cập nhật</span>
                        </p>
                        <button th:if="${b.soLuongTon != null and b.soLuongTon > 0 and b.giaBanCu != null}"
                                type="button" class="btn btn-accent btn-sm w-100" data-add-to-cart data-requires-login data-so-luong="1"
                                th:attr="data-ma-sach=${b.maSach}">
                            <i class="bi bi-cart-plus me-1" aria-hidden="true"></i>Thêm vào giỏ
                        </button>
                        <a th:unless="${b.soLuongTon != null and b.soLuongTon > 0 and b.giaBanCu != null}"
                           th:href="@{/books/{id}(id=${b.maSach})}" class="btn btn-outline-brown btn-sm w-100">Xem chi tiết</a>
                        <span th:if="${b.soLuongTon == null or b.soLuongTon <= 0}" class="small text-muted mt-2">Hết hàng</span>
                    </div>
                </div>
            </article>
        </div>

        <nav th:if="${books.totalPages > 1}" class="mt-4" aria-label="Phân trang sách của chi nhánh">
            <ul class="pagination justify-content-center align-items-center mb-0">
                <li class="page-item" th:classappend="${books.page == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/branches/{id}(id=${branch.maCH},page=${books.page - 1},sort=${sort})}">Trước</a>
                </li>
                <li class="page-item disabled"><span class="page-link" th:text="|Trang ${books.page + 1} / ${books.totalPages}|"></span></li>
                <li class="page-item" th:classappend="${books.page + 1 >= books.totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/branches/{id}(id=${branch.maCH},page=${books.page + 1},sort=${sort})}">Sau</a>
                </li>
            </ul>
        </nav>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
